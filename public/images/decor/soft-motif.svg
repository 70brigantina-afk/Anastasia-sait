<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1100" fill="none">
  <defs>
    <filter id="line-relief" x="-50%" y="-50%" width="200%" height="200%" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation="0.9" result="blur"/>
      <feOffset in="blur" dx="1.2" dy="1.4" result="shOff"/>
      <feFlood flood-color="#5c6562" flood-opacity="0.42" result="shColor"/>
      <feComposite in="shColor" in2="shOff" operator="in" result="shadow"/>
      <feOffset in="blur" dx="-1.1" dy="-1.2" result="hiOff"/>
      <feFlood flood-color="#ffffff" flood-opacity="0.85" result="hiColor"/>
      <feComposite in="hiColor" in2="hiOff" operator="in" result="highlight"/>
      <feMerge>
        <feMergeNode in="shadow"/>
        <feMergeNode in="highlight"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Только линии: дыхание, лист, бутон, намёк на цветок -->
  <g filter="url(#line-relief)" stroke="#8a8174" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M55 175 C145 100, 250 130, 325 225" stroke-width="1.55"/>
    <path d="M80 220 C165 160, 250 180, 315 255" stroke-width="1.05"/>

    <!-- Лист контуром -->
    <g transform="translate(700 145) rotate(-12)">
      <path d="M0 62 C18 34, 22 12, 0 0 C-22 12, -18 34, 0 62Z" stroke-width="1.35"/>
      <path d="M0 54 V8" stroke-width="1"/>
      <path d="M0 22 C10 28, 14 38, 15 48" stroke-width="0.85"/>
      <path d="M0 22 C-10 28, -14 38, -15 48" stroke-width="0.85"/>
    </g>

    <!-- Бутон линиями -->
    <g transform="translate(155 770)">
      <path d="M0 52 C16 28, 20 10, 0 0 C-20 10, -16 28, 0 52Z" stroke-width="1.3"/>
      <path d="M-14 22 C-2 10, 8 10, 16 24" stroke-width="1.05"/>
      <path d="M-8 34 C0 26, 8 26, 12 36" stroke-width="0.9"/>
      <path d="M0 52 C2 68, 1 82, 0 96" stroke-width="1.05"/>
    </g>

    <!-- Цветок линиями (редко) -->
    <g transform="translate(655 830)">
      <path d="M40 70 C40 42, 58 28, 78 42 C70 52, 55 58, 40 70Z" stroke-width="1.2"/>
      <path d="M40 70 C55 48, 78 42, 96 58 C82 62, 62 68, 40 70Z" stroke-width="1.15"/>
      <path d="M40 70 C28 48, 22 28, 40 18 C48 32, 48 50, 40 70Z" stroke-width="1.15"/>
      <path d="M40 70 C18 78, 8 98, 22 118" stroke-width="1.05"/>
      <path d="M40 70 C52 88, 48 112, 32 128" stroke-width="1"/>
    </g>

    <path d="M575 915 C665 855, 755 875, 835 955" stroke-width="1.25"/>
  </g>
</svg>
